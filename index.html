<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png" />
    <title>NKD Spiritual Friends App</title>

    <link rel="stylesheet" href="StylesCommon.css" />
    <link rel="stylesheet" href="StylesSpecific.css" />
    <link rel="stylesheet" href="StylesTable.css" />
    <link rel="stylesheet" href="StylesFriends.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.34/moment-timezone-with-data.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <div class="primaryContainerDiv">
      <div id="loadingSpinner" style="display: none">
        <div class="spinner"></div>
      </div>
      <div class="infoPopup" id="successPopup">
        <div class="infoPopup-content">
          <div class="infoPopup-icon success"></div>
          <h2 class="infoPopup-heading success">Success!</h2>
          <div id="successMessage" class="infoPopup-message"></div>
          <button class="green" id="successOkButton">OKAY</button>
        </div>
      </div>
      <div class="infoPopup" id="errorPopup">
        <div class="infoPopup-content">
          <div class="infoPopup-icon error"></div>
          <h2 class="infoPopup-heading error">Error!</h2>
          <div id="errorMessage" class="infoPopup-message"></div>
          <button class="red" onclick="CLOSE_INFO_POPUP('errorPopup')">
            TRY AGAIN
          </button>
        </div>
      </div>
      <div class="infoPopup" id="infoPopup">
        <div class="infoPopup-content">
          <div class="infoPopup-icon info"></div>
          <h2 class="infoPopup-heading info">Information</h2>
          <div id="infoMessage" class="infoPopup-message"></div>
          <button class="green" onclick="CLOSE_INFO_POPUP('infoPopup')">
            OKAY
          </button>
        </div>
      </div>
      <div class="infoPopup" id="confirmationPopup">
        <div class="infoPopup-content">
          <div class="infoPopup-icon confirmation"></div>
          <div class="infoPopup-message" id="confirmationMessage"></div>
          <div class="button-row">
            <button class="red" id="confirmationNoButton">NO</button>
            <button class="green" id="confirmationYesButton">YES</button>
          </div>
        </div>
      </div>

      <div class="infoPopup" id="confirmationGridPopup">
        <div class="infoPopup-content">
          <div class="infoPopup-icon confirmation"></div>

          <!-- Status Text Area -->
          <div id="confirmationGridStatusText" class="heading"></div>

          <!-- Table Grid Container -->
          <div
            id="confirmationGridContainer"
            class="collection-table-container scrollable-content-table"
            style="margin-top: 10px"
          >
            <table id="confirmationGridTable">
              <thead id="confirmationGridTHead" class="table-header">
                <!-- Table headers will be dynamically generated here -->
              </thead>
              <tbody id="confirmationGridTBody">
                <!-- Table rows will be dynamically generated here -->
              </tbody>
            </table>
          </div>

          <!-- Buttons for Confirmation -->
          <div class="button-row">
            <button class="red" id="confirmationGridNoButton">NO</button>
            <button class="green" id="confirmationGridYesButton">YES</button>
          </div>
        </div>
      </div>

      <div class="popup" id="verificationGridPopup">
        <div
          class="popup-content scrollable-content"
          id="verificationGridSubPopup"
        >
          <img
            src="https://drive.google.com/thumbnail?id=1aYobBIvFM5yJUgqLktnHjzwxuFX0OfGn&sz=w500"
            alt="NKD Logo"
          />
          <div
            class="user-info-block"
            id="verifyDetailsHeading_div"
            style="display: none"
          >
            <p id="verifyDetailsHeading_lbl"></p>
          </div>
          <div class="heading" id="gridHeading">Verify Details</div>
          <div class="button-row">
            <button class="red" id="verificationBackButton">Back</button>
            <button class="green" id="verificationSubmitBtn">Submit</button>
          </div>
        </div>
      </div>

      <div class="popup" style="display: flex" id="mainMenuPopup">
        <div class="popup-content scrollable-content">
          <img
            src="https://drive.google.com/thumbnail?id=1aYobBIvFM5yJUgqLktnHjzwxuFX0OfGn&sz=w500"
            alt="NKD Logo"
          />
          <h2>Spiritual Friends' App</h2>
          <input
            type="text"
            id="passworTxtBox"
            placeholder="Password"
            required
          />
          <div class="error" id="passworTxtBoxError"></div>
          <div class="button-row">
            <button
              class="red"
              onclick="
                document.getElementById('passworTxtBox').value = '';
                document.getElementById('passworTxtBoxError').innerHTML = '';
              "
            >
              Clear
            </button>
            <button
              class="green"
              id="submitPassBtn"
              onclick="submitPass()"
              disabled
            >
              Login
            </button>
          </div>
        </div>
      </div>

      <div class="popup" id="userMenuPopup">
        <div class="popup-content scrollable-content">
          <img
            src="https://drive.google.com/thumbnail?id=1aYobBIvFM5yJUgqLktnHjzwxuFX0OfGn&sz=w500"
            alt="NKD Logo"
          />

          <div>
            <p class="user-info-block"></p>
          </div>

          <br />
          <h2>Spiritual Friends' Dashboard</h2>

          <button class="green" onclick="openAddDevoteeForm()">
            + Add New Devotee
          </button>

          <button class="green" onclick="openSpiritualFriendsWindow()">
            My Spiritual Friends
          </button>

            <button class="accordion-header">
              Administration
              <span class="icon">▶</span>
            </button>

            <div class="accordion-content">
              <div class="question-grid">
                <button class="green" onclick="openTimeTableWindow()">
                  My Class Timetable
                </button>

                <button class="green" onclick="openTeacherDetailsWindow()">
                  My Teachers' Details
                </button>

                <button class="green" onclick="openAttendanceDashboard()">
                  My Attendance
                </button>

                <button class="green" onclick="openAcademicReportsScreen()">
                  My Academic Reports
                </button>
              </div>
            </div>
          </div> -->

          <div class="accordion-item" id="adminDropdown" hidden>
            <button class="accordion-header">
              Administration
              <span class="icon">▶</span>
            </button>

            <!-- <div class="accordion-content">
              <div class="question-grid">
                <button class="green" onclick="openSyllabusDashboard()">
                  Examination Syllabus
                </button>

                <button class="green" onclick="openDateSheetWindow()">
                  Examination Datesheet
                </button>

                <button class="green" onclick="openComputerExamWindow()">
                  My Computers Examination
                </button>
              </div>
            </div> -->
          </div>

          <button class="red" onclick="onLogoutClick()">Logout</button>
        </div>
      </div>

      <div class="popup" id="myFriendsPopup">
        <div class="popup-content scrollable-content">
          <img
            src="https://drive.google.com/thumbnail?id=1aYobBIvFM5yJUgqLktnHjzwxuFX0OfGn&sz=w500"
            alt="NKD Logo"
          />

          <div>
            <p class="user-info-block"></p>
          </div>

          <br />
          <h2>My Spiritual Friends</h2>

          <!-- ================= DEVOTEES ================= -->

          <div class="associated-section">
            <div class="associated-section-header">
              <h3>Devotees</h3>
              <span id="devoteeCount" class="people-count">0</span>
            </div>

            <div id="devoteeTableContainer" class="people-table-container">
              <!-- Devotee table will be generated here -->
            </div>
          </div>

          <br /><br />

          <!-- ================= STUDENTS ================= -->

          <div class="associated-section">
            <div class="associated-section-header">
              <h3>Students</h3>
              <span id="studentCount" class="people-count">0</span>
            </div>

            <div id="studentTableContainer" class="people-table-container">
              <!-- Student table will be generated here -->
            </div>
          </div>

          <button class="red" onclick="SHOW_SPECIFIC_DIV('userMenuPopup')">
            Back
          </button>
        </div>
      </div>

      <!-- Meeting Form -->

      <div class="popup" id="meetingFormContainer">
        <div class="popup-content scrollable-content">
          <img
            src="https://drive.google.com/thumbnail?id=1aYobBIvFM5yJUgqLktnHjzwxuFX0OfGn&sz=w500"
            alt="NKD Logo"
          />

          <div>
            <p class="user-info-block"></p>
          </div>

          <br />
          <h3 id="meetingHeader"></h3>

          <!-- Dynamic meeting form will be inserted here -->
          <div id="meetingForm"></div>

          <div class="button-row">
            <button
              type="button"
              class="purple"
              onclick="SHOW_SPECIFIC_DIV('userMenuPopup')"
            >
              Home
            </button>
            <button
              type="button"
              class="yellow"
              onclick="SHOW_SPECIFIC_DIV('meetingHistoryPopup')"
            >
              Back
            </button>

            <button
              type="button"
              class="red"
              onclick="
                SHOW_CONFIRMATION_POPUP(
                  'Are you sure you want to reset the form?',
                  resetMeetingForm,
                )
              "
            >
              Reset
            </button>

            <button
              type="button"
              class="green"
              onclick="
                SHOW_CONFIRMATION_POPUP(
                  'Are you sure you want to submit the meeting data?',
                  saveMeeting,
                )
              "
              disabled
              id="meetingSubmitBtn"
            >
              Submit
            </button>
          </div>
        </div>
      </div>

      <!-- =====================================================
     MEETING HISTORY POPUP
===================================================== -->

      <div class="popup" id="meetingHistoryPopup">
        <div class="popup-content scrollable-content">
          <img
            src="https://drive.google.com/thumbnail?id=1aYobBIvFM5yJUgqLktnHjzwxuFX0OfGn&sz=w500"
            alt="NKD Logo"
          />

          <div>
            <p class="user-info-block"></p>
          </div>

          <br />
          <h3 id="meetingHistoryHeader"></h3>
          <br />

          <div id="meetingHistoryContainer"></div>

          <div class="button-row">
            <button class="red" onclick="SHOW_SPECIFIC_DIV('myFriendsPopup')">
              Back
            </button>
            <button class="green" id="meetingHistoryMeetNowBtn">
              Meet Now
            </button>
          </div>
        </div>
      </div>

      <!-- =====================================================
     MEETING DETAILS POPUP
===================================================== -->

      <div id="meetingDetailsPopup" class="popup">
        <div class="popup-content">
          <img
            src="https://drive.google.com/thumbnail?id=1aYobBIvFM5yJUgqLktnHjzwxuFX0OfGn&sz=w500"
            alt="NKD Logo"
          />

          <div>
            <p class="user-info-block"></p>
          </div>

          <br />
          <h3 id="meetingHistoryHeader2"></h3>
          <br />

          <div id="meetingDetailsContainer"></div>

          <button
            type="button"
            class="red"
            onclick="SHOW_SPECIFIC_DIV('meetingHistoryPopup')"
          >
            Back
          </button>
        </div>
      </div>

      <!-- =====================================================
     ADD DEVOTEE POPUP
===================================================== -->

      <div class="popup" id="addDevoteePopup">
        <div class="popup-content scrollable-content">
          <img
            src="https://drive.google.com/thumbnail?id=1aYobBIvFM5yJUgqLktnHjzwxuFX0OfGn&sz=w500"
            alt="NKD Logo"
          />

          <div>
            <p class="user-info-block"></p>
          </div>

          <br />
          <h3>Add New Devotee</h3>

          <div id="addDevoteeForm">
            <!-- First Name -->
            <label class="required">First Name (Non Initiated)</label>
            <input
              type="text"
              id="devoteeFirstName"
              placeholder="Enter first name"
            />
            <div id="Err_devoteeFirstName" class="error"></div>

            <!-- Last Name -->
            <label class="required">Last Name (Non Initiated)</label>
            <input
              type="text"
              id="devoteeLastName"
              placeholder="Enter last name"
            />
            <div id="Err_devoteeLastName" class="error"></div>

            <!-- Initiated Name -->
            <label>Initiated Name</label>
            <input
              type="text"
              id="devoteeInitiatedName"
              placeholder="WITHOUT Das/Devi Dasi/Prabhuji/Mataji"
            />
            <div id="Err_devoteeInitiatedName" class="error"></div>

            <!-- Official Name -->
            <label class="required"> Official Name (As per Aadhar) </label>

            <input
              type="text"
              id="devoteeOfficialName"
              placeholder="Enter official name"
            />

            <div id="Err_devoteeOfficialName" class="error"></div>

            <!-- Gender -->
            <label class="required">Gender</label>

            <div class="options">
              <input
                type="radio"
                id="devoteeGenderMale"
                name="devoteeGender"
                value="Male"
                class="custom-radio"
              />

              <label
                for="devoteeGenderMale"
                class="custom-label-radio-content-custom-box"
              >
                Male
              </label>

              <input
                type="radio"
                id="devoteeGenderFemale"
                name="devoteeGender"
                value="Female"
                class="custom-radio"
              />

              <label
                for="devoteeGenderFemale"
                class="custom-label-radio-content-custom-box"
              >
                Female
              </label>
            </div>

            <div id="Err_devoteeGender" class="error"></div>

            <!-- Mobile -->
            <label class="required">Mobile Number</label>

            <input
              type="text"
              id="devoteeMobile"
              placeholder="Enter 10 digit mobile number"
              maxlength="10"
            />

            <div id="Err_devoteeMobile" class="error"></div>

            <!-- WhatsApp -->
            <label class="required">WhatsApp Number</label>

            <div class="options">
              <label
                for="devoteeWhatsappSameAsMobile"
                class="custom-label-chkbox"
              >
                Same as Mobile Number
              </label>
              <input
                type="checkbox"
                id="devoteeWhatsappSameAsMobile"
                class="custom-radio"
              />
            </div>

            <input
              type="text"
              id="devoteeWhatsapp"
              placeholder="Enter 10 digit WhatsApp number"
              maxlength="10"
            />

            <div id="Err_devoteeWhatsapp" class="error"></div>

            <!-- Date of Birth -->
            <label class="required">Date of Birth</label>

            <input type="date" id="devoteeDOB" />

            <div id="Err_devoteeDOB" class="error"></div>

            <!-- Date of Marriage -->
            <label>Date of Marriage</label>

            <input type="date" id="devoteeMarriageDate" />

            <div id="Err_devoteeMarriageDate" class="error"></div>

            <!-- Email -->
            <label>Email</label>

            <input
              type="text"
              id="devoteeEmail"
              placeholder="Enter email address"
            />

            <div id="Err_devoteeEmail" class="error"></div>

            <!-- Residence Address -->
            <label class="required"> Residence Address </label>

            <textarea
              id="devoteeAddress"
              rows="3"
              placeholder="Enter residence address"
            >
            </textarea>

            <div id="Err_devoteeAddress" class="error"></div>

            <!-- Profession -->
            <label class="required">Profession</label>

            <input
              type="text"
              id="devoteeProfession"
              placeholder="Enter profession"
            />

            <div id="Err_devoteeProfession" class="error"></div>

            <!-- Skills -->
            <label class="required">Skills</label>

            <textarea id="devoteeSkills" rows="3" placeholder="Enter skills">
            </textarea>

            <div id="Err_devoteeSkills" class="error"></div>

            <!-- Weekly Off -->
            <!-- <label class="required">Weekly Off</label>

            <div class="weekly-off-options">
              <div class="weekly-off-option">
                <input
                  type="checkbox"
                  id="devoteeWeeklyOffNA"
                  value="NA"
                  class="custom-checkbox"
                />
                <label for="devoteeWeeklyOffNA"> NA </label>
              </div>

              <div class="weekly-off-option">
                <input
                  type="checkbox"
                  id="devoteeWeeklyOffMon"

              <div class="weekly-off-option">

                  id="devoteeWeeklyOffTue"
                  value="Tuesday"

              <div class="weekly-off-option">
                <input

                  id="devoteeWeeklyOffWed"

                  class="custom-checkbox weekly-off-day"
                />
                <label for="devoteeWeeklyOffWed"> Wed </label>
              </div>

              <div class="weekly-off-option">
                <input
                  type="checkbox"
                  id="devoteeWeeklyOffThu"
                  value="Thursday"
                  class="custom-checkbox weekly-off-day"
                />
                <label for="devoteeWeeklyOffThu"> Thu </label>
              </div>

              <div class="weekly-off-option">
                <input
                  type="checkbox"
                  id="devoteeWeeklyOffFri"
                  value="Friday"
                  class="custom-checkbox weekly-off-day"
                />
                <label for="devoteeWeeklyOffFri"> Fri </label>
              </div>

              <div class="weekly-off-option">
                <input
                  type="checkbox"
                  id="devoteeWeeklyOffSat"
                  value="Saturday"
                  class="custom-checkbox weekly-off-day"
                />
                <label for="devoteeWeeklyOffSat"> Sat </label>
              </div>

              <div class="weekly-off-option">
                <input
                  type="checkbox"
                  id="devoteeWeeklyOffSun"
                  value="Sunday"
                  class="custom-checkbox weekly-off-day"
                />
                <label for="devoteeWeeklyOffSun"> Sun </label>
              </div>
            </div>

            <div id="Err_devoteeWeeklyOff" class="error"></div> -->
          </div>

          <!-- ACTIONS -->

          <div class="button-row">
            <button
              type="button"
              class="yellow"
              onclick="
                resetAddDevoteeForm();
                SHOW_SPECIFIC_DIV('userMenuPopup');
              "
            >
              Back
            </button>

            <button
              type="button"
              class="red"
              onclick="
                SHOW_CONFIRMATION_POPUP(
                  'Are you sure you want to reset the form?',
                  resetAddDevoteeForm,
                )
              "
            >
              Reset
            </button>

            <button
              type="button"
              class="green"
              onclick="
                SHOW_CONFIRMATION_POPUP(
                  'Are you sure you want to submit the data?',
                  saveNewDevotee,
                )
              "
              disabled
              id="newDevoteeSubmitBtn"
            >
              Submit
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="ScriptCommon.js"></script>
    <script src="ScriptConstants.js"></script>
    <script src="Script.js"></script>
    <script src="ScriptMyFriends.js"></script>
    <script src="ScriptMeetHistory.js"></script>
    <script src="ScriptMeetFriend.js"></script>
    <script src="ScriptNewDevotee.js"></script>
  </body>
</html>
